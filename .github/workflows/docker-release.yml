name: Build RSS runtime image
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rss-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: names
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          load: true
          tags: rss-runtime:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rss-runtime
          cache-to: type=gha,mode=max,scope=rss-runtime
      - name: Verify runtime and production configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh rss-runtime:verify -ec '
            test -f /app/dist/main.js
            test -d /app/prisma/migrations
            test ! -d /app/src
            test ! -d /app/test
            test ! -e /app/.env.production
            test ! -e /app/node_modules/.bin/tsc
            test ! -e /app/node_modules/.bin/nest
            test -z "$(find /app/dist -type f -name "*.map")"
            node --check /app/dist/main.js
          '
          WEWE_RSS_IMAGE=rss-runtime:verify MYSQL_ROOT_PASSWORD=test MYSQL_PASSWORD=test AUTH_CODE=test docker compose -f docker-compose.production.yml config --quiet
          sh -n deploy/update.sh
      - name: Publish immutable image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag rss-runtime:verify "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          mkdir -p release
          printf 'WEWE_RSS_IMAGE=%s\n' "$digest" > release/image.env
          cp docker-compose.production.yml release/
          cp deploy/update.sh release/
          printf 'Image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rss-deploy-${{ github.sha }}
          path: release/
